tube.com/playlist?list=PLIeVYF4vhFA44D813FvvzlX4Vn4R1snGV\n\n-\nSosyal Medya Hesaplarımız:\nTwitter: www.twitter.com/kardiyobey\nInstagram: www.instagram.com/kardiyobey\nTiktok: www.tiktok.com/@kardiyobey\nYouTube: www.youtube.com/@kardiyobey\nWeb: www.drmuhammedkeskin.com\n\n\n\n#kardiyoloji #kardiyobey #Aortgenişlemesi #aorta", "yerlestirilebilir": "1"}, {"sira": "28", "video_id": "xIPbvPFYS0U", "baslik": "Kalp Krizi Sonrası Uygulanabilecek Tedaviler Nelerdir? | Prof. Dr. Ali Civelek", "kanal": "ProjeMED", "yukleme_tarihi": "2023-01-30", "sure_sn": "106", "aciklama": "Sorularınız mı Var? Bizimle iletişime geçin. / If you have any questions or would like a quote, please contact us.\nWhatsApp: https://bit.ly/contact-iletisim\nWeb Form: https://projemed.com/r/info\n\nKalp krizi sonrası tedavi yöntemleri \nKalp krizi sonrası tedavi yöntemleri şunlar olabilir:\n\nMedikal tedavi: İlaçlar (aspirin, statinler, ACE inhibitörleri vb.), kalp ritmi problemleri için elektroşok tedavisi veya kalp pili takılması.\n\nCerrahi tedavi: Stent takma, koroner bypass ameliyatı.\n\nRehabilitasyon: Fizik tedavi, egzersiz programları veya hastane dışı rehabilitasyon programları.\n\nDeğişen yaşam tarzı önerileri: Sigara bırakma, sağlıklı bir diyet, düzenli egzersiz, stres yönetimi ve aşırı alkol kullanımının azaltılması.\n\nKoroner bypass ameliyatı ne zaman yapılır?\nKoroner bypass ameliyatı, kalbin oksijen ve kan almasını sağlayan damarların (koroner arterler) tıkanması sonucu oluşan kalp hastalıklarının tedavisi için yapılır. Bu ameliyat, aşağıdaki durumlarda önerilebilir:\n\nAngina (kalp ağrısı) veya kalp krizi geçirme riski yüksek olan hastalar.\n\nKalp yetmezliği bulguları olan hastalar.\n\nTeşhis edilmiş koroner arter hastalığı bulunan hastalar.\n\nKalbin belirli bölümlerinde dolaşım bozukluğu olan hastalar.\n\nDaha önceki angioplasti veya stent tedavisi başarısız olan hastalar.\n\nHer hasta için uygun tedavinin belirlenmesi için doktorların tıbbi değerlendirmesi ve hastanın durumunun değerlendirilmesi gerekir.\n\n\nProjemed Yapım.\n\nSağlık sektöründe birbirinden önemli uzman doktorlarla beraber merak edilen bir çok sağlık konusunda bilinmeyenleri ele alan bir kanaldır. Ağız sağlığından kbb'ye, obeziteden genel cerrahiye, estetik cerrahiden kadın sağlığına ve daha bir çok hastalık ve tanı konularında dinamik içerik üretmektedir.\n\nYeni video içeriklerimizi takip etmek isterseniz abone olmayı unutmayın.\nhttps://bit.ly/2CpR841 \n\n- Tüm estetik videoları için tıklayın: https://bit.ly/3jmqnye\n- Tüm ameliyat videoları için tıklayın: https://bit.ly/32w1ytr\n- Tüm hasta röportajları için tıklayın: https://bit.ly/2ODQqTa\n- Tüm ağız ve diş sağlığı videoları için tıklayın: https://bit.ly/2Cq6SnE\n- Tüm Göz hastalıkları videoları için tıklayın: https://bit.ly/398iasJ \n\nWebsite: http://projemed.com\nFacebook: https://www.facebook.com/projemedyapim/\nInstagram: https://www.instagram.com/projemedyapim/\nCome2Care: https://come2care.com", "yerlestirilebilir": "1"}, {"sira": "29", "video_id": "FF44xU-UyG0", "baslik": "Kalp büyümesinin belirtileri nelerdir?", "kanal": "Sağlık", "yukleme_tarihi": "2013-12-25", "sure_sn": "28", "aciklama": "Kalp büyümesi erken dönemde bulgu vermeyebilir, ilerleyen dönemlerde nefes darlığı, bacaklarda şişme gibi bulguları olabilir.", "yerlestirilebilir": "1"}, {"sira": "30", "video_id": "GtjAOxkmkpE", "baslik": "Kronik Kalp Yetersizliğine Yaklaşım ve Tedavi Seçenekleri", "kanal": "Ankara Bilkent Şehir Hastanesi", "yukleme_tarihi": "2021-02-09", "sure_sn": "3146", "aciklama": "Ankara Şehir Hastanemiz ile ilgili en yeni içerikler ve güncel videolar için kanalımıza abone olmayı unutmayın.\n\nKanalımıza Abone Olmak İçin: https://www.youtube.com/c/ankarasehirhastanesiyoutube\n\n►Web Sitemiz https://ankarasehir.saglik.gov.tr/\n►Facebook https://www.fb.com/ankarasehirhast/\n►Twitter https://www.twitter.com/ankarasehirhast/\n►Instagram : https://www.instagram.com/ankarasehirhast/", "yerlestirilebilir": "1"}, {"sira": "31", "video_id": "JpgCPnngOG4", "baslik": "Kalp hastalıklarının 10 belirtisi!", "kanal": "Prof. Dr. Muhammed Keskin", "yukleme_tarihi": "2023-01-29", "sure_sn": "752", "aciklama": "Ben Doç. Dr. Muhammed Keskin. \n\nKalp hastalığı, kalpte meydana gelen ve kalbi etkileyen herhangi bir bozukluğu kapsayan bir terimdir. Kalp hastalığı başlığı altında koroner arter hastalığı gibi kan damar hastalıkları, kalp ritmi problemleri (aritmiler) ve bu hastalıkların yanında doğuştan gelen kalp kusurları yer alır. Kalp hastalıkları terimi çoğunlukla kardiyovasküler hastalık terimi ile dönüşümlü olarak kullanılır. \n\nBu videoda Kalp hastalıklarının en sık belirtileri olan ' Kalp Hastalığının belirtileri nelerdir? Kalp hastalıkları nelerdir? Göğüste ağrı olması kalp hastalıkları belirtisi olabilir mi? Yemeklerden sonra göğüs ağrısı kalp hastalıkları belirtisi olabilir mi? Karın bölgesinde ağrı neden olur? Karın bölgesinde ağrı kalp hastalıkları belirtisi olabilir mi? Kalp yetmezliğinde karında şişlik olması normal mi? Karında şişlik kalp krizi belirtisi olabilir mi? Mide bulantısı kalp krizi belirtisi olabilir mi? Kol ağrısı neden olur?  Kol ağrısı kalp krizi belirtisi olabilir mi? Parmaklarda uyuşma kalp krizi belirtisi olabilir mi? Sağ kol ağrısı tehlikeli olabilir mi?  Baş dönmesi neden olur? Baş dönmesi hangi hastalıkların belirtisidir? Nabız düşüklüğü neden olur? Nabız düşüklüğü kalp krizi belirtisi olabilir mi? Çene ağrısı neden olur? Çene ağrısı kalp krizi belirtisi olabilir mi? Çabuk yorulma neden olur? Nefes darlığı neden olur? Çabuk yorulmak kalp hastalıkları belirtisi olabilir mi? Nefes darlığı kalp hastalıkları belirtisi olabilir mi? Bacaklarda şişlik neden olur? Bacaklarda şişlik hastalık belirtisi olabilir mi? Bacaklarda şişlik kalp hastalığı belirtisi olabilir mi? Terleme neden olur? Soğuk terleme nasıl giderilir? Soğuk terleme kalp hastalığı belirtisi olabilir mi? Kalp hastalıklarının belirtileri nelerdir? Kalp hastalıklarının tanısı nasıl konulur? ' sorularına yanıt verdim.\n\n\ ttps://www.kalbinisev.org\nhttps://www.drahmetkarabulut.com\n\n#kalpyetersizliği #kalpsağlığı #kalbinisev #drahmetkarabulut", "yerlestirilebilir": "1"}, {"sira": "34", "video_id": "8xOO03mlpsY", "baslik": "Kalp Büyümesi Tehlikeli Bir Hastalık Mı? | Prof. Dr. Ahmet Karabulut", "kanal": "PROF DR AHMET KARABULUT", "yukleme_tarihi": "2025-02-04", "sure_sn": "307", "aciklama": "Kalp Büyümesi Tehlikeli Bir Hastalık Mı? | Prof. Dr. Ahmet Karabulut\n\nKalp büyümesi, birçok kişinin merak ettiği ve endişe duyduğu bir sağlık sorunu. Peki, kalp büyümesi nedir? Bu durum her zaman ciddi bir hastalık belirtisi midir, yoksa tedavi edilebilir bir durum mudur? Bu videoda, kalp büyümesi hakkında merak edilen tüm sorulara yanıt veriyor ve bu duruma karşı alabileceğiniz önlemleri açıklıyoruz.\n\n📌 Bu videoda ele alınan başlıklar:\nKalp büyümesi nedir ve neden olur?\nKalp büyümesinin belirtileri ve teşhis yöntemleri.\nHangi durumlarda tehlikeli hale gelir?\nTedavi yöntemleri ve yaşam tarzı değişikliklerinin önemi.\n\nProf. Dr. Ahmet Karabulut sağlıklı yaşamın yollarını anlatıyor... Kanalımıza abone olarak yeni programımız Prof. Dr. Ahmet Karabulut ile Kalbini Sev olmak üzere, güncel programlarımızı takip edebilirsiniz...\nDaha fazlası için web sayfalarımızı ziyaret edin:\nhttps://www.kalbinisev.org\nhttps://www.drahmetkarabulut.com\n\n#kalpbüyümesi", "yerlestirilebilir": "1"}, {"sira": "35", "video_id": "eL2Hq4Gs15I", "baslik": "Kalp Büyümesi Hakkında Bilmeniz Gerekenler", "kanal": "Prof. Dr. Muhammed Keskin", "yukleme_tarihi": "2025-10-09", "sure_sn": "71", "aciklama": "Kalp büyümesi, yani kardiyomegali, tek başına bir hastalık değil; genellikle kalp yetmezliği, hipertansiyon, kapak hastalıkları veya uzun süreli kalp yüklenmesi gibi durumların bir sonucudur. Kalp, vücuda yeterli kan pompalayabilmek için zamanla büyür; ancak bu büyüme her zaman “güçlü bir kalp” anlamına gelmez. Aksine, kalp duvarı kalınlaşır veya boşluklar genişlerse kalp kası zayıflayabilir ve kalp yetmezliği gelişebilir. Bu videoda kalp büyümesinin nedenlerini, ne zaman tehlikeli hale geldiğini ve EECP (Gelişmiş Dış Kalp Desteği) gibi yeni tedavi yöntemlerinin bu durumda nasıl bir rol oynayabileceğini anlattım. 🫀 Erken tanı, doğru tedavi ve düzenli takip, kalp büyümesini kontrol altına almanın en önemli adımlarıdır.\n\nSayfa içeriği sadece bilgilendirme amaçlıdır, tanı ve tedavi için mutlaka doktorunuza başvurunuz.\n\nDoç. Dr. Muhammed Keskin\n🩺Girişimsel & Klinik Kardiyolog\n☎️02164757066\n📍Feneryolu Bağdat Caddesi No:91/4, Kadıköy, İstanbul\n\nSosyal medya hesaplarımız;\n- Web sitesi: https://drmuhammedkeskin.com/\n- İnstagram: https://www.instagram.com/@UCZYb5RUCJiV4pUl6Da8DGPg \n- TikTok: https://www.tiktok.com/@doc.dr.muhammedkeskin", "yerlestirilebilir": "1"}, {"sira": "36", "video_id": "9du1TX-gltQ", "baslik": "Kalp Yetmezliği Tanı Ve Tedavisi", "kanal": "Prof. Dr. Bülent Demir", "yukleme_tarihi": "2026-01-31", "sure_sn": "515", "aciklama": "Bu kanal kalp ve damar sağlığınızı korumak, kalp dostu beslenme önerileri, sağlıklı yaşam ipuçları ve bilimsel bilgileri anlaşılır bir şekilde paylaşmak için oluşturulmuştur.\n\n🫀Kalp Damar Hastalıkları Uzmanı\n\nMega Medipol Üniversite Hastanesi\n☎️ 444 7 044\n\nINSTAGRAM: https://www.instagram.com/profdrbulentdemir/\nBLOG  : https://drbulentdemir.com.tr/blogum/", "yerlestirilebilir": "1"}, {"sira": "37", "video_id": "UaDM-tHKRMA", "baslik": "Sol Ventrikül Hipertrofisi Nedir? | Kalp Duvar Kalınlaşmasının Nedenleri", "kanal": "Prof. Dr. Muhammed Keskin", "yukleme_tarihi": "2025-07-28", "sure_sn": "203", "aciklama": "Sol ventrikül hipertrofisi, yani kalbin sol karıncık duvarının kalınlaşması, kalp sağlığında oldukça önemli bir konudur. Bu videoda, sol ventrikül hipertrofisinin ne olduğunu, nedenlerini ve hangi durumlarda iyi ya da kötü bir anlam taşıdığını açıklıyorum. En sık karşılaşılan neden olan hipertansiyon, kalbin yüksek basınca karşı çalışmak zorunda kalması nedeniyle duvarların zamanla kalınlaşmasına yol açar. Bunun yanı sıra aort kapak darlığı gibi yapısal kalp sorunları da benzer bir tabloya neden olabilir. Hipertrofik kardiyomiyopati ise genetik geçişli, kalp kasının anormal kalınlaşmasıyla giden farklı bir hastalık türüdür. Öte yandan, sporcularda görülen fizyolojik kalp duvar kalınlaşması, genellikle sağlıklı bir adaptasyon olarak değerlendirilir ve herhangi bir hastalık belirtisi değildir. Bu farkları iyi anlamak, hem tanı hem de tedavi süreçleri açısından kritik öneme sahiptir. Videoda tüm bu ayrıntılara sade ve anlaşılır bir dille değiniyorum.\n\n#reklam \n\nBu videoda kalp duvar kalınlaşması ile ilgili merak ettiğiniz “Kalp duvar kalınlaşması nedir? Kalp duvar kalınlaşması neden olur?\nTansiyon kalp duvar kalınlaşması yapar mı? Kalp duvar kalınlaşması nelere neden olur? Hipertrofik kardiyomiyopati nedir Sporcularda kalp duvar kalınlaşması neden olur?” Sorulara yanıt verdim. \n\n00:30 Kalp duvar kalınlaşması nedir?\n01:00 Kalp duvar kalınlaşması neden olur?\n01:30 Tansiyon kalp duvar kalınlaşması yapar mı?\n02:30 Kalp duvar kalınlaşması nelere neden olur?\n02:40 Hipertrofik kardiyomiyopati nedir?\n03:00 Sporcularda kalp duvar kalınlaşması neden olur?\n\nDiğer videolarımıza göz atmayı unutmayın.\n- Kalp yetmezliğe ile ilgili tüm merak edilenler:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA5-Yv-iB-JHy5KV7ySJQV-V\n- Sağlıklı Beslenme ve Yaşam:\nhttps://www.youtube.com/playlist?list=PLIeVYF4vhFA5oNM57OKZ6UZ20_J81K0r2\n- Kalp Sağlığı Hakkında Diğer Her Şey\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA4toidQ_HBw0_0wL3yVv0Mt\n- Kalp Kriziyle İlgili Tüm Merak Edilenler:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA69UEB4_VjZj1neZvge7ylO\n- Kalp Hastalıkları ve Oruç:\n https://youtube.com/playlist?list=PLIeVYF4vhFA42FTpmIC4XHPdqDw6OoTAC\n- Tansiyonla İlgili Tüm Merak Edilenler:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA7j-cq53edEfhFQPstrGLgH\n- Sık Sorulan Sorular:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA44D813FvvzlX4Vn4R1snGV\n\nRandevu: 02164757066\nAdres: Doç.Dr.Muhammed Keskin, Kadıköy, İstanbul\nKonum: https://maps.app.goo.gl/GKERVDRQdPBttXhj6?g_st=ic\n\n-\nSosyal Medya Hesaplarımız:\nTwitter: www.twitter.com/kardiyobey\nInstagram: www.instagram.com/kardiyobey\nTiktok: www.tiktok.com/@kardiyobey\nYouTube: www.youtube.com/@kardiyobey\nWeb: www.drmuhammedkeskin.comPodcast Spotify: https://open.spotify.com/show/4Zc2pueoPj4VQsm8pZrny5\n\n#solventrikülhipertrofisi #solventrikülhipertrofisinedir #kalpduvarkalınlaşması #kalpduvarkalınlaşmasınedenolur #kalpduvarkalınlığı #tansiyonyüksekliği", "yerlestirilebilir": "1"}, {"sira": "38", "video_id": "OZYkHkMO9zE", "baslik": "Kalp Yetmezliği Belirtileri - Uzm. Dr. Serkan Yakan | 1 Branş, 1 Uzman, 1 Konu", "kanal": "Özel Sağlık Hastanesi", "yukleme_tarihi": "2021-02-09", "sure_sn": "440", "aciklama": "Kalp yetmezliği kalbin pompaladığı kanın vücudun ihtiyaçlarını karşılayamamasıdır. Çok değişik sebeplerden dolayı kalp yetmezliği olabilir. Kalp yetmezliğine götüren sebepleri düşünürsek bunların başında, kalp damar hastalıkları, hipertansiyon ve kalp kapak rahatsızlıklarının genetik temelleri bulunmaktadır. Kalp yetmezliği daha çok ileri yaşlarda görülmektedir. Çok değişik hastalıklar kalp yetmezliğine neden olabildiği için genç yaşta da kalp yetmezliği görülebilir.\n\n#ÖzelSağlıkHastanesi #ÖzelSağlıkİzmir #ÖzelSağlıkHastanesiİzmir", "yerlestirilebilir": "1"}, {"sira": "39", "video_id": "ISBV81jgYaI", "baslik": "Mitral Kapak Yetmezliği Nedir? Derecelendirme ve Tedavi Seçenekleri Nelerdir?", "kanal": "Prof. Dr. Mustafa Güden", "yukleme_tarihi": "2023-09-06", "sure_sn": "140", "aciklama": "Mitral kapak yetmezliği hastalığının tanısında kullanılan en etkili yöntem ekokardiyografidir.\n\nMitral kapak yetmezliği, kalp kapaklarının düzgün çalışmadığı bir durumdur. Bu hastalığı değerlendirmek için sıfırdan dörde kadar derecelendirme kullanılır:\n\n0️⃣ Sıfır: Hiç kaçak olmaması.\n\n1️⃣ Bir: Hafif kaçak olması.\n\n2️⃣ İki: Hafif / Orta kaçak olması.\n\n3️⃣ Üç: Orta kaçak olması.\n\n4️⃣ Dört: Şiddetli / İleri kaçak olması şeklindedir.\n\nAmeliyat kararı verilirken mitral yetmezlik derecesinin, şiddetli / ileri (4) olmasının yanı sıra hastanın şikayetinin olup olmaması, ritim bozuklukları, kabin kasılma gücünün azalması, kalbin çaplarının büyümesi, akciğer basıncının artması gibi kriterler göz önünde bulundurulur.\n\nHafif veya orta düzeydeki mitral kapak yetmezliklerinde cerrahi müdahale gerekli değildir. Fakat unutmayın ki hastalığın seyri zaman içinde değişebilir. Bu nedenle düzenli doktor ve ekokardiyografi kontrollerinin yapılması önemlidir. \n\nUmarım bu bilgiler mitral kapak yetmezliği hastalığını ve derecelendirmelerini daha iyi anlamanıza yardımcı olmuştur. Sağlığınıza özen gösterin ve kalp sağlığınıza dikkat edin.\n\n#MustafaGüden, #KalpDamarCerrahisi, #KalpDamarCerrahı, #KalpKapakları, #KalpKapakHastalıkları, #MitralKapak, #MitralKapakYetmezliği, #MitralKapakTamiri, #MitralKapakDeğişimi, #KalpAmeliyatı", "yerlestirilebilir": "1"}, {"sira": "40", "video_id": "k3qlxq2Vf1A", "baslik": "Kalp Duvar Sertleşmesi ve Kalınlaşması Tehlikeli midir?", "kanal": "Prof. Dr. Muhammed Keskin", "yukleme_tarihi": "2023-08-16", "sure_sn": "127", "aciklama": "Ben Doç. Dr. Muhammed Keskin.  Kalp duvarında sertleşme genellikle arter duvarlarında kolesterol birikiminin neden olduğu ateroskleroz sonucu meydana gelir. Yüksek kolesterol seviyeleri, kötü beslenme alışkanlıkları, sigara içme, fiziksel inaktivite ve yüksek tansiyon gibi faktörler, arter duvarlarında plak oluşumuna yol açar. Bu plaklar arterleri daraltarak kan akışını kısıtlar, oksijen ve besin maddelerinin kalbe ulaşmasını zorlaştırır. Sertleşme, kalp krizi riskini artırabilir. Sağlıklı bir yaşam tarzı benimsemek, düzenli egzersiz yapmak, sağlıklı beslenmek, sigaradan kaçınmak ve doktor tavsiyelerine uymak, sertleşmenin riskini azaltabilir.\n\nBu videoda kalp duvar sertleşmesi ile ilgili merak ettiğiniz \"Kalp duvarında sertleşme nedir? Kalp duvarında sertleşme tehlikeli midir? Kalp duvarları neden sertleşir? Yaş arttıkça kalp duvarları sertleşir mi? Kilo almak kalp duvarlarını sertleştirir mi? Aort kapakta daralma kalp duvarlarını sertleştirir mi? Hipertrofik kardiyomiyopati nedir? Kalp duvar sertleşmesinin tedavisi var mıdır?\" sorularına yanıt verdim.\n\n00:15 Kalp duvarında sertleşme nedir?\n00:20 Kalp duvarında sertleşme tehlikeli midir?\n00:25 Kalp duvarları neden sertleşir?\n00:27 Yaş arttıkça kalp duvarları sertleşir mi?\n00:29 Kilo almak kalp duvarlarını sertleştirir mi?\n00:35 Aort kapakta daralma kalp duvarlarını sertleştirir mi?\n01:15 Hipertrofik kardiyomiyopati nedir?\n01:20 Kalp duvar sertleşmesinin tedavisi var mıdır?\n01:40 Kalp duvar sertleşmesinin kontrolü nasıl yapılır?\n\nDiğer videolarımıza göz atmayı unutmayın.\n- Kalp yetmezliğe ile ilgili tüm merak edilenler:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA5-Yv-iB-JHy5KV7ySJQV-V\n- Sağlıklı Beslenme ve Yaşam:\nhttps://www.youtube.com/playlist?list=PLIeVYF4vhFA5oNM57OKZ6UZ20_J81K0r2\n- Kalp Sağlığı Hakkında Diğer Her Şey\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA4toidQ_HBw0_0wL3yVv0Mt\n- Kalp Kriziyle İlgili Tüm Merak Edilenler:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA69UEB4_VjZj1neZvge7ylO\n- Kalp Hastalıkları ve Oruç:\n https://youtube.com/playlist?list=PLIeVYF4vhFA42FTpmIC4XHPdqDw6OoTAC\n- Tansiyonla İlgili Tüm Merak Edilenler:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA7j-cq53edEfhFQPstrGLgH\n- Sık Sorulan Sorular:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA44D813FvvzlX4Vn4R1snGV\n\n-\nSosyal Medya Hesaplarımız:\nTwitter: www.twitter.com/kardiyobey\nInstagram: www.instagram.com/kardiyobey\nTiktok: www.tiktok.com/@kardiyobey\nYouTube: www.youtube.com/@kardiyobey\nWeb: https://drmuhammedkeskin.com\n\n\n#kardiyoloji #kardiyobey #kalpduvarları #kalpduvarkalınlaşması #kalpduvarlarındaserleşme #tansiyon #tansiyonyüksekliği #diyabet #kanşekeriyüksekliği #insülin #ekokardiyografi", "yerlestirilebilir": "1"}, {"sira": "41", "video_id": "SsYFQoEmZNo", "baslik": "Kalp yetmezliğinde ilaçların ı Uzmanı olarak askerlik görevini yaptı. Kısa bir süre Ankara Dr. Zekai Tahir Burak Kadın Hastalıkları Hastanesinde iç hastalıkları konsültanı olarak görev yaptıktan sonra, şu andaki adı Başkent Üniversitesi, o zamanki adı Türkiye Organ Nakli ve Yanık Tedavi Merkezi olan hastanede iç hastalıkları ve hemodiyaliz sorumlusu olarak çalıştı.  Dört yıl Mardin'de serbest hekim olarak çalıştı. 1992 yılında İç Hastalıkları Doçenti oldu. 1994-1999 yılları arasında Düzen Laboratuvarlar Grubunun Kardiyoloji Bölümünü yönetti. Yine 1994 yılında Özel Metropol İç Hastalıkları ve Hipertansiyon Kliniğini kurarak 17 yıl boyunca bu merkezi çalıştırdı. \n\n2011 yılından beri Ankara’da özel muayenehanesinde hastalara hizmet vermektedir.  \n\nŞekip Altunkan Instagram: https://www.instagram.com/sekipaltunkan\nŞekip Altunkan Facebook : https://www.facebook.com/sekip.altunkan\nŞekip Altunkan Web           : https://www.sekipaltunkan.com/\nPhotomuz Fotoğrafçılık    : https://www.instagram.com/photomuz/?h...", "yerlestirilebilir": "1"}, {"sira": "60", "video_id": "Mt0CawVTsx8", "baslik": "KALPTE BÜYÜME NEDİR? NASIL TEDAVİ EDİLİR? KALP YETMEZLİĞİ VE TEDAVİ YÖNTEMLERİ", "kanal": "Prof. Dr. Muhammed Keskin", "yukleme_tarihi": "2026-09-24", "sure_sn": "244", "aciklama": "Kalpte büyüme nedir, hangi durumlarda ortaya çıkar ve tedavisi nasıl yapılır?\n\nBu videomuzda kalbin anatomasini, sol karıncık büyümesinin önemini, kalbin kasılma gücünü gösteren ekokardiyografi (EF) değerlerini ve kalp büyümesi ile kalp yetmezliği arasındaki ilişkiyi detaylarıyla ele alıyoruz.\n\nKardiyomegalinin tanı süreçlerinden güncel \"muhteşem dörtlü\" ilaç tedavilerine, ameliyatsız bir seçenek olan EECP (Doğal Bypass) yönteminden hasta takibinin önemine kadar merak ettiğiniz tüm soruların yanıtlarını bu içerikte bulabilirsiniz.\n\nVideomu beğenmeyi, düşüncelerinizi yorumlarda paylaşmayı ve kanalıma abone olmayı unutmayın!\n\n0:00 Başlangıç\n0:07 Kalp Yapısı ve Karıncık / Kulakçık Kavramı Nedir?\n0:20 Kalpte Büyüme Nedir?\ ARATAY, NİHAL DOĞAN MODERATÖRLÜĞÜNDE HALKIN SORULARINI CEVAPLIYOR VE ÇÖZÜM ÖNERİLERİNİ AÇIKLIYOR...  \n\n1. TÜRK HALKINDA KALP SORUNLARI NEDEN ARTIYOR?  KALBİMİZİN SAĞLIKLI OLUP OLMADIĞINI KENDİMİZ ANLAYABİLİR MİYİZ?  \n2. TÜM HASTALIKLARIN KÖKTEN GELEN TEMEL SEBEBİ NE? BU SEBEP KALP HASTALIKLARINI NASIL TETİKLİYOR? \n3. KALP SORUNLARI VÜCUTTA HANGİ SİNYALLERİ VERİYOR? PIHTI NASIL OLUŞUYOR? \n4. KANDA HOMOSİSTEİN YÜKSEKLİĞİ, TRİGLİSERİD YÜKSEKLİĞİ, ÜRİK ASİT YÜKSEKLİĞİ NEYİN GÖSTERGESİ? BU KAN DEĞERLERİNİN YÜKSELMESİNE SEBEP OLAN ETKENLER NELER? \n5. YÜKSEK KOLESTEROL TEHLİKELİ Mİ? DAMARLARI TIKAR MI? KALP HASTALIKLARI GENETİK Mİ? EPİGENETİK Mİ? \n6. KRONİK HASTALIĞA BAĞLI 20-30 YIL İLAÇ KULLANANLAR NEDEN İLGİLİ HASTALIKTAN DEĞİL DE KALP YETMEZLİĞİNDEN RAHMETLİ OLUYOR? KRONİK HASTALIĞA BAĞLI İLAÇ KULLANANLAR KALBİNİ NASIL KORUYABİLİR?\n7.  EN TEMEL GIDAMIZ NE?KARATAY DİYETİ KRONİK HASTALIKLARINDAN İYİLEŞMEYE NASIL ETKİ EDİYOR?\n8. UZUN YILLAR DİÜRETİK ETKİLİ İLAÇ KULLANAN VE AYNI ZAMANDA TUZSUZ BESLENENLER NE YAPMALI?\n9. KARDİYAK AMİLOİDOZ HASTALIĞI NEDİR? BU HASTALIĞA KARŞI NE YAPMAK GEREKİR?\n10. KALP ÇARPINTISI SEBEPLERİ NELERDİR?  \n11. HERHANGİ BİR ŞİKAYET YOKSA ANJİYO YAPMAK GEREKLİ Mİ? YÜKSEK NABIZ RAHATSIZLIK VERMİYORSA İLAÇ KULLANMAK GEREKLİ Mİ?  \n12. YENİ KALP KRİZİ GEÇİRMİŞ BİRİ ZEYTİNYAĞI TÜKETEBİLİR Mİ? KORONER RAHATSIZLIĞI OLANLARIN YUMURTA, HAYVANSAL YAĞ, KRİSTAL KAYA TUZU TÜKETMELERİ SAKINCALI Mİ?  \n\nVideonun altına yorumlar kısmına sağlık alanında genel sorularınızı yazabilirsiniz...", "yerlestirilebilir": "1"}, {"sira": "69", "video_id": "Vn0Ea6XXLyY", "baslik": "Kalp Yetmezliğinden Korkmayın! İşte Yeni Tedaviler.", "kanal": "Prof. Dr. Muhammed Keskin", "yukleme_tarihi": "2025-03-29", "sure_sn": "282", "aciklama": "Kalp yetmezliği, birçok kişi için korkutucu bir tanı gibi görünse de, yolun sonu değildir. En sık nedeni kalp damar tıkanıklıklarıdır ve bu tıkanıklıklar, anjiyo, stent veya bypass gibi uygun yöntemlerle giderilebilir. Günümüzde yeni nesil ilaçlar, kalbin yükünü azaltarak hastaların yaşam kalitesini artırmada büyük rol oynar. Ayrıca EECP (Enhanced External Counter Pulsation) tedavisi, kalbe giden damarları güçlendiren ve destekleyen önemli bir alternatif tedavi seçeneğidir. Kardiyak rehabilitasyon ise kontrollü egzersiz ve yaşam alışkanlıkları değişikliğiyle kalbinizi daha güçlü hale getirmeye yardımcı olur. Tüm bunların yanında düzenli doktor kontrolleri, zamanında müdahale ve kalp yetmezliğiyle mücadelede başarı şansını artırır. Bu videoda, kalp yetmezliğinin yönetimi ve kalp sağlığınızı korumak için neler yapabileceğinizi tüm detaylarıyla anlatıyoruz.\n\nBu videoda kalp yetmezliği tedavisi ile ilgili merak ettiğiniz \"Kalp yetmezliğinin en sık nedeni nedir? Damar tıkanıklıklarının olması kalp yetmezliğine neden olur mu? Yeni nesil ilaçlar kalp yetmezliğini tedavi edebilir mi? EECP tedavisi ile kalp yetmezliği tedavi edilebilir mi? Kardiyak rehabilitasyon ile kalp yetmezliği tedavi edilebilir mi? Kalp yetmezliğinde kontrol ne sıklıkla olmalı?\"sorularına yanıt verdim.\n\n00:30 Kalp yetmezliğinin en sık nedeni nedir?\n00:45 Damar tıkanıklıklarının olması kalp yetmezliğine neden olur mu?\n01:00 Yeni nesil ilaçlar kalp yetmezliğini tedavi edebilir mi?\n01:40 EECP tedavisi ile kalp yetmezliği tedavi edilebilir mi?\n02:20 Kardiyak rehabilitasyon ile kalp yetmezliği tedavi edilebilir mi?\n03:20 Kalp yetmezliğinde kontrol ne sıklıkla olmalı?\n\nDiğer videolarımıza göz atmayı unutmayın.\n- Kalp yetmezliğe ile ilgili tüm merak edilenler:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA5-Yv-iB-JHy5KV7ySJQV-V\n- Sağlıklı Beslenme ve Yaşam:\nhttps://www.youtube.com/playlist?list=PLIeVYF4vhFA5oNM57OKZ6UZ20_J81K0r2\n- Kalp Sağlığı Hakkında Diğer Her Şey\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA4toidQ_HBw0_0wL3yVv0Mt\n- Kalp Kriziyle İlgili Tüm Merak Edilenler:\nhttps://youtube.com/playlist?list=PLIeVYF4vhFA69UEB4_VjZj1neZvge7ylO\n- Kalp Hastalıkları ve Oruç:\n https://youtube.com/playlist?list=PLIeVYF
